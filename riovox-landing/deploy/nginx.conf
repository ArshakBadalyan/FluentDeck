# One domain: landing page at /, Flutter web app at /app/.
# Upload the contents of riovox-landing/dist/ (after `npm run build:all`) to /var/www/riovox.
server {
    listen 80;
    server_name riovox.app www.riovox.app;
    root /var/www/riovox;

    # Landing page assets are content-hashed.
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }

    # The web app: unknown /app/... paths are app routes.
    location = /app { return 301 /app/$is_args$args; }
    location /app/ {
        try_files $uri $uri/ /app/index.html;
        location ~ \.html$ { add_header Cache-Control "no-cache"; }
    }

    location / { try_files $uri $uri/ =404; }

    types { application/wasm wasm; }
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm;
}
