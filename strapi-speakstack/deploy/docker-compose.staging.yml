# Hetzner staging — run from this directory after cloning both repos side by side:
#
#   /opt/mathapp-staging/
#     strapi-math/          ← this repo
#     matheapp-f/           ← Flutter (only for --profile web)
#
#   cd strapi-math/deploy
#   cp ../.env.staging.example ../.env.staging   # fill values in .env.staging
#   docker compose --env-file ../.env.staging -f docker-compose.staging.yml up -d --build
#
# Optional Flutter web:
#   docker compose -f docker-compose.staging.yml --profile web up -d --build

name: mathapp-staging

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-strapi}
      POSTGRES_USER: ${POSTGRES_USER:-strapi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-strapi} -d ${POSTGRES_DB:-strapi}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  strapi:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env.staging
    environment:
      NODE_ENV: staging
      HOST: 0.0.0.0
      PORT: 1337
      DATABASE_URL: postgres://${POSTGRES_USER:-strapi}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-strapi}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:1337/admin',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - internal
    expose:
      - "1337"

  web:
    profiles:
      - web
    build:
      context: ../../matheapp-f
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - internal
    expose:
      - "80"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      strapi:
        condition: service_healthy
    networks:
      - internal

volumes:
  pgdata:

networks:
  internal:
    driver: bridge
