# Optional Flutter web — use with main compose file:
#   docker compose -f docker-compose.staging.yml -f docker-compose.staging.web.yml --profile web up -d --build

services:
  nginx:
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/web.conf:/etc/nginx/conf.d/web.conf:ro
    depends_on:
      - strapi
      - web
