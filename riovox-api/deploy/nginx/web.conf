# Flutter web at /web/ — used with: docker compose -f docker-compose.staging.yml -f docker-compose.staging.web.yml --profile web up -d
# IP-only: server_name _ ; open http://SERVER_IP/web/
# Domain deploy (not used): DNS staging.yourdomain.de → SERVER_IP

upstream flutter_web {
  server web:80;
}

server {
  listen 80;
  server_name EXAMPLE.COM;

  location /web/ {
    proxy_pass http://flutter_web/web/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = / {
    return 302 /web/;
  }
}
