name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: speakstack-f
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: cp .env.example assets/speakstack_config.txt
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  strapi:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: strapi-speakstack
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
          cache-dependency-path: strapi-speakstack/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn test:apkg
      - run: node --test tests/flashcard-review-queue.test.js
